# Tiny Tapeout sky-26c (ttsky26c) project information
yaml_version: 6

project:
  title:        "Maestros WiFi Smart Traffic-Light Controller"
  author:       "Team Maestros (University of Arizona)"
  discord:      ""
  description:  "WiFi-assisted (ESP32-over-SPI) smart traffic-light controller for the TinyQV RISC-V SoC. Counts vehicles, applies congestion-aware thresholding, falls back to an inductive-loop detector, raises a level-triggered interrupt, and authenticates SPI packets with a keyed CRC8 and replay protection."
  language:     "Verilog"
  clock_hz:     50000000

  tiles:        "1x1"

  top_module:   "tt_um_uofa_traffic"

  # Source files, relative to src/.
  source_files:
    - "tt_wrapper.v"
    - "tqvp_spi_traffic4.v"
    - "spi_reg.v"
    - "synchronizer.v"

# Pinout. The controller's own external pins use the dedicated ui_in/uo_out
# lanes (loop detector + ESP32 SPI in; traffic request/status out). The TinyQV
# register bus is accessed over the SPI peripheral harness on the uio pins.
pinout:
  # Dedicated inputs
  ui[0]: "inductive loop detect input"
  ui[1]: "ESP32 SPI SCK"
  ui[2]: "ESP32 SPI CS_N (active low)"
  ui[3]: "ESP32 SPI MOSI"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Dedicated outputs
  uo[0]: "supplemental request to 555/controller"
  uo[1]: "WiFi congestion present"
  uo[2]: "filtered loop-detect status"
  uo[3]: "latched interrupt pending"
  uo[4]: "ESP32 SPI MISO (tied low, write-only)"
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins (TinyQV register-bus access via the SPI harness)
  uio[0]: "user_interrupt - out"
  uio[1]: "data_ready - out"
  uio[2]: ""
  uio[3]: "register-bus SPI MISO - out"
  uio[4]: "register-bus SPI CS_N - in"
  uio[5]: "register-bus SPI SCLK - in"
  uio[6]: "register-bus SPI MOSI - in"
  uio[7]: ""
